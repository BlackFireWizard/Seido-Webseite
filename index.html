<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a68b2">
<title>Robin Seido</title>
<meta name="description" content="Diese Seite gehört Robin Seido.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='34' fill='%23ed2939'/%3E%3Crect y='34' width='100' height='32' fill='%23fff'/%3E%3Crect y='66' width='100' height='34' fill='%23ed2939'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #2a68b2; overflow: hidden; }
  canvas { display: block; touch-action: manipulation; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  noscript { position: absolute; inset: 0; display: grid; place-items: center; font: 2rem Georgia, serif; color: #fff; text-align: center; padding: 2rem; }
</style>
</head>
<body>
<h1 class="sr-only">Diese Seite gehört Robin Seido.</h1>
<canvas id="c" aria-hidden="true"></canvas>
<noscript>Diese Seite gehört Robin Seido.</noscript>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAU = Math.PI * 2;

  /* ============ helpers ============ */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function makeNoise(seed) {
    var r = rng(seed), p = [];
    for (var i = 0; i < 512; i++) p.push(r());
    return function (x) {
      var i = Math.floor(x), f = x - i;
      var a = p[((i % 512) + 512) % 512], b = p[(((i + 1) % 512) + 512) % 512];
      var s = f * f * (3 - 2 * f);
      return a + (b - a) * s;
    };
  }
  function ridge(noise, x, scale, oct) {
    var sum = 0, amp = 1, tot = 0, fr = 1;
    for (var o = 0; o < oct; o++) {
      var n = noise(x * fr / scale + o * 37.7);
      n = 1 - Math.abs(2 * n - 1);
      sum += n * amp; tot += amp; amp *= 0.5; fr *= 2.1;
    }
    return sum / tot;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

  function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
  function circ(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
  function ell(g, x, y, rx, ry, c, rot) { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU); g.fill(); }
  function poly(g, pts, c) {
    g.fillStyle = c; g.beginPath(); g.moveTo(pts[0], pts[1]);
    for (var i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
    g.closePath(); g.fill();
  }
  function line(g, x1, y1, x2, y2, c, w) {
    g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  }

  /* ============ state ============ */
  var W, H, dpr, S;
  var layers = {};
  var clouds = [], mists = [], birds = [];
  var pw, rb, poleX, poleTop;
  var fw, fh, flagX, flagY, flagImg;
  var COLS, ROWS = 8, SW, G, XV;
  var p1 = 0.4, p2 = 1.9, p3 = 3.1;
  var shoreY, lakeX0, lakeX1;
  var gNoise = makeNoise(91);
  var scene = {};          // positions of dynamic things
  var hits = [];
  var vignette = null;
  var shadeStyles = [];
  for (var si = 0; si <= 24; si++) {
    var sh = (si - 12) / 12;
    shadeStyles.push(sh > 0
      ? 'rgba(14,0,6,' + (sh * 0.42).toFixed(3) + ')'
      : 'rgba(255,250,240,' + (-sh * 0.32).toFixed(3) + ')');
  }

  function mk() {
    var c = document.createElement('canvas');
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    var g = c.getContext('2d');
    g.scale(dpr, dpr);
    return { c: c, g: g };
  }
  function groundY(x) { return H * 0.935 - H * 0.012 * gNoise(x / (W * 0.2) + 3); }
  function lakeMask(x) { return smooth(lakeX0 - W * 0.05, lakeX0 + W * 0.03, x) * (1 - smooth(lakeX1 - W * 0.03, lakeX1 + W * 0.05, x)); }
  function bankY(x) { return H * 0.862 - H * 0.03 * gNoise(x / (W * 0.18) + 11); }
  function lakeEdge(side, y) {
    var f = clamp((y - shoreY) / (H - shoreY), 0, 1), slant = W * 0.05;
    var wob = (gNoise(y / (H * 0.035) + (side < 0 ? 5 : 17)) - 0.5) * W * 0.02;
    return side < 0 ? lakeX0 - slant * Math.pow(f, 1.2) + wob * f : lakeX1 + slant * Math.pow(f, 1.2) + wob * f;
  }
  function addHit(o) { hits.push(o); return o; }

  /* ============ sky ============ */
  function buildSky() {
    var L = mk(), g = L.g;
    var gr = g.createLinearGradient(0, 0, 0, H * 0.82);
    gr.addColorStop(0, '#2a68b2');
    gr.addColorStop(0.3, '#5a9fdb');
    gr.addColorStop(0.55, '#a6d1ee');
    gr.addColorStop(0.8, '#f6e2c6');
    gr.addColorStop(1, '#fbead3');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    var sx = W * 0.17, sy = H * 0.16;
    var glow = g.createRadialGradient(sx, sy, 0, sx, sy, H * 0.65);
    glow.addColorStop(0, 'rgba(255,246,218,0.95)');
    glow.addColorStop(0.1, 'rgba(255,238,196,0.6)');
    glow.addColorStop(0.4, 'rgba(255,226,172,0.18)');
    glow.addColorStop(1, 'rgba(255,226,172,0)');
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'screen';
    for (var k = 0; k < 9; k++) {
      var a = 0.12 + k * 0.17, len = H * 1.5, sp = 0.03 + (k % 3) * 0.01;
      g.fillStyle = 'rgba(255,240,205,0.06)';
      g.beginPath(); g.moveTo(sx, sy);
      g.lineTo(sx + Math.cos(a - sp) * len, sy + Math.sin(a - sp) * len);
      g.lineTo(sx + Math.cos(a + sp) * len, sy + Math.sin(a + sp) * len);
      g.closePath(); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    var core = g.createRadialGradient(sx, sy, 0, sx, sy, H * 0.04);
    core.addColorStop(0, '#ffffff'); core.addColorStop(0.7, '#fffbe6'); core.addColorStop(1, 'rgba(255,251,230,0)');
    g.fillStyle = core; g.beginPath(); g.arc(sx, sy, H * 0.04, 0, TAU); g.fill();
    layers.sky = L.c;
  }

  /* ============ clouds, mist ============ */
  function makeCloud(w, h, rand, n, flat) {
    var c = document.createElement('canvas');
    c.width = Math.ceil(w); c.height = Math.ceil(h);
    var g = c.getContext('2d');
    for (var j = 0; j < n; j++) {
      var cx = h * 0.5 + rand() * (w - h);
      var rad = h * (flat ? 0.3 + rand() * 0.25 : 0.26 + rand() * 0.26);
      var cy = h * (flat ? 0.5 : 0.62) - rand() * h * (flat ? 0.2 : 0.28);
      var gr = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
      gr.addColorStop(0, 'rgba(255,255,255,0.95)');
      gr.addColorStop(0.6, 'rgba(255,255,255,0.55)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, rad, 0, TAU); g.fill();
    }
    g.globalCompositeOperation = 'source-atop';
    var sg = g.createLinearGradient(0, 0, 0, h);
    sg.addColorStop(0, 'rgba(255,248,235,0.0)');
    sg.addColorStop(0.5, 'rgba(255,255,255,0)');
    sg.addColorStop(1, 'rgba(120,150,195,0.42)');
    g.fillStyle = sg; g.fillRect(0, 0, w, h);
    return c;
  }
  function buildClouds() {
    var rand = rng(21), k = clamp(W / 1200, 0.6, 1.3), i;
    clouds = [];
    for (i = 0; i < 6; i++) {
      var w = (200 + rand() * 240) * k, h = w * (0.34 + rand() * 0.12);
      clouds.push({ img: makeCloud(w, h, rand, 11, false), w: w, h: h, y: H * (0.05 + rand() * 0.36), x0: rand() * (W + w * 2), v: 3 + (w / k - 200) * 0.04 + rand() * 2, a: 0.6 + rand() * 0.35 });
    }
    for (i = 0; i < 3; i++) {
      var cw = (420 + rand() * 300) * k, ch = 46 * k;
      clouds.push({ img: makeCloud(cw, ch, rand, 16, true), w: cw, h: ch, y: H * (0.04 + rand() * 0.2), x0: rand() * (W + cw * 2), v: 2 + rand() * 1.5, a: 0.45 });
    }
    mists = [];
    for (i = 0; i < 4; i++) {
      var mw = (360 + rand() * 360) * k, mh = 60 * k;
      var c = document.createElement('canvas'); c.width = Math.ceil(mw); c.height = Math.ceil(mh);
      var g = c.getContext('2d');
      var gr = g.createRadialGradient(mw / 2, mh / 2, 0, mw / 2, mh / 2, mw / 2);
      gr.addColorStop(0, 'rgba(255,248,240,0.55)'); gr.addColorStop(1, 'rgba(255,248,240,0)');
      g.setTransform(1, 0, 0, mh / mw, 0, 0); g.fillStyle = gr; g.fillRect(0, 0, mw, mw);
      mists.push({ img: c, w: mw, h: mh, y: H * (0.70 + rand() * 0.06), x0: rand() * (W + mw * 2), v: 2.5 + rand() * 2 });
    }
  }

  /* ============ mountains ============ */
  function shadeRidge(g, pts, o, rand) {
    var len0 = o.amp * 0.22;
    for (var i = 2; i < pts.length - 2; i++) {
      var p = pts[i], sl = pts[i + 2][1] - pts[i - 2][1];
      var L = len0 * (0.25 + rand() * 0.75), a;
      if (sl > 1.5) {
        a = Math.min(0.20, sl * 0.012) * (o.shade || 1);
        g.fillStyle = 'rgba(36,48,92,' + a.toFixed(3) + ')'; g.fillRect(p[0], p[1], 3, L);
              } else if (sl < -1.5) {
        a = Math.min(0.18, -sl * 0.010);
        g.fillStyle = 'rgba(255,244,222,' + a.toFixed(3) + ')'; g.fillRect(p[0], p[1], 3, L * 0.7);
      }
    }
  }
  function mountainLayer(g, o) {
    var noise = makeNoise(o.seed), rand = rng(o.seed + 1), pts = [], minY = 1e9, x, k;
    for (x = 0; x <= W + 3; x += 3) {
      var y = o.baseY - o.amp * ridge(noise, x, o.scale, 5);
      if (o.peaks) for (k = 0; k < o.peaks.length; k++) {
        var pk = o.peaks[k], d = Math.abs(x - pk.x) / pk.w;
        if (d < 1) y -= pk.h * Math.pow(1 - d, pk.p);
      }
      if (y > o.baseY) y = o.baseY;
      pts.push([x, y]); if (y < minY) minY = y;
    }
    var gr = g.createLinearGradient(0, minY, 0, o.baseY + o.amp * 0.25);
    if (o.snow) {
      gr.addColorStop(0, '#fffdf8'); gr.addColorStop(0.13, '#f4f0f4'); gr.addColorStop(0.3, o.rock);
    } else {
      gr.addColorStop(0, o.rock);
    }
    gr.addColorStop(1, o.haze);
    g.beginPath(); g.moveTo(0, H);
    for (k = 0; k < pts.length; k++) g.lineTo(pts[k][0], pts[k][1]);
    g.lineTo(W + 3, H); g.closePath();
    g.fillStyle = gr; g.fill();
    shadeRidge(g, pts, o, rand);
    return pts;
  }
  function ptsY(pts, x) {
    var i = clamp(Math.round(x / 3), 0, pts.length - 1);
    return pts[i][1];
  }
  function spruces(g, pts, rand, color, h0, from, to) {
    g.fillStyle = color;
    for (var i = 0; i < pts.length - 1; i += 1 + Math.floor(rand() * 3)) {
      var p = pts[i];
      if (from !== undefined && (p[0] < from || p[0] > to)) continue;
      var th = h0 * (0.6 + rand() * 0.9), tw = th * 0.36;
      g.beginPath();
      g.moveTo(p[0], p[1] - th * 0.62);
      g.lineTo(p[0] - tw, p[1] + th * 0.38);
      g.lineTo(p[0] + tw, p[1] + th * 0.38);
      g.closePath(); g.fill();
    }
  }

  /* ============ landmarks ============ */
  function house(g, x, y, w, h, wall, roof, s) {
    g.fillStyle = wall; g.fillRect(x, y - h, w, h);
    g.fillStyle = 'rgba(40,30,60,0.15)'; g.fillRect(x + w * 0.62, y - h, w * 0.38, h);
    poly(g, [x - w * 0.06, y - h, x + w * 0.5, y - h - w * 0.42, x + w * 1.06, y - h], roof);
    if (w > 6 * s) {
      var ww = Math.max(1, w * 0.14), wh = Math.max(1.4, h * 0.22);
      g.fillStyle = 'rgba(60,45,40,0.75)';
      g.fillRect(x + w * 0.18, y - h * 0.72, ww, wh);
      g.fillRect(x + w * 0.6, y - h * 0.72, ww, wh);
      if (h > 9 * s) { g.fillRect(x + w * 0.18, y - h * 0.38, ww, wh); g.fillRect(x + w * 0.6, y - h * 0.38, ww, wh); }
    }
  }

  function drawSalzburg(g, cx, by, s) {
    var rand = rng(33), hillH = 112 * s, hw = 105 * s, ht = by - hillH, i;
    function hy(x) { var t = (x - cx) / hw; return (t > -1 && t < 1) ? by - hillH * Math.pow(1 - t * t, 0.5) : by; }
    var gr = g.createLinearGradient(0, ht, 0, by);
    gr.addColorStop(0, '#79985f'); gr.addColorStop(0.5, '#5b7d49'); gr.addColorStop(1, '#3f6039');
    g.beginPath(); g.moveTo(cx - hw, by);
    for (i = -hw; i <= hw; i += 3 * s) g.lineTo(cx + i, hy(cx + i));
    g.lineTo(cx + hw, by); g.closePath(); g.fillStyle = gr; g.fill();
    // rock face
    for (i = 0; i < 26; i++) {
      var rx = cx - hw * 0.85 + rand() * hw * 0.7, ry = hy(rx);
      g.fillStyle = 'rgba(160,152,136,' + (0.25 + rand() * 0.3).toFixed(2) + ')';
      g.fillRect(rx, ry + 2 * s, (2 + rand() * 3) * s, (8 + rand() * 30) * s);
    }
    for (i = 0; i < 70; i++) {
      var tx = cx - hw * 0.95 + rand() * hw * 1.9, ty = hy(tx) + rand() * (by - hy(tx)) * 0.92;
      circ(g, tx, ty, (1.5 + rand() * 2.2) * s, rand() < 0.5 ? '#2f5233' : '#44703f');
    }
    // fortress
    var ft = ht + 3 * s, cream = '#eee3cf', shade = '#c9bba0', roofc = '#86402f';
    rect(g, cx - 80 * s, ft - 6 * s, 150 * s, 12 * s, '#d8cbb2');
    rect(g, cx - 80 * s, ft + 3 * s, 150 * s, 3 * s, 'rgba(60,40,30,0.25)');
    for (i = 0; i < 18; i++) rect(g, cx - 79 * s + i * 8.4 * s, ft - 8.5 * s, 4 * s, 2.6 * s, '#d8cbb2');
    // main block
    rect(g, cx - 32 * s, ft - 44 * s, 68 * s, 40 * s, cream);
    rect(g, cx + 24 * s, ft - 44 * s, 12 * s, 40 * s, shade);
    poly(g, [cx - 36 * s, ft - 44 * s, cx - 26 * s, ft - 62 * s, cx + 30 * s, ft - 62 * s, cx + 40 * s, ft - 44 * s], roofc);
    rect(g, cx - 26 * s, ft - 62 * s, 56 * s, 2 * s, 'rgba(255,230,200,0.35)');
    g.fillStyle = 'rgba(70,52,40,0.8)';
    for (i = 0; i < 6; i++) { g.fillRect(cx - 27 * s + i * 10 * s, ft - 36 * s, 3 * s, 5 * s); g.fillRect(cx - 27 * s + i * 10 * s, ft - 22 * s, 3 * s, 5 * s); }
    // turret
    rect(g, cx + 6 * s, ft - 82 * s, 11 * s, 22 * s, cream);
    rect(g, cx + 12 * s, ft - 82 * s, 5 * s, 22 * s, shade);
    poly(g, [cx + 4 * s, ft - 82 * s, cx + 11.5 * s, ft - 100 * s, cx + 19 * s, ft - 82 * s], roofc);
    // side towers
    rect(g, cx - 66 * s, ft - 40 * s, 16 * s, 40 * s, cream);
    rect(g, cx - 56 * s, ft - 40 * s, 6 * s, 40 * s, shade);
    poly(g, [cx - 68 * s, ft - 40 * s, cx - 58 * s, ft - 62 * s, cx - 48 * s, ft - 40 * s], roofc);
    rect(g, cx + 48 * s, ft - 32 * s, 14 * s, 32 * s, cream);
    rect(g, cx + 56 * s, ft - 32 * s, 6 * s, 32 * s, shade);
    poly(g, [cx + 46 * s, ft - 32 * s, cx + 55 * s, ft - 50 * s, cx + 64 * s, ft - 32 * s], roofc);
    g.fillStyle = 'rgba(70,52,40,0.8)';
    g.fillRect(cx - 60 * s, ft - 30 * s, 2.5 * s, 5 * s); g.fillRect(cx + 53 * s, ft - 22 * s, 2.5 * s, 5 * s);
    // town below the hill, right side
    var x = cx + hw * 0.55, pal = ['#efe2c4', '#e6c9a1', '#e9b9a2', '#d9d2c0', '#f0dcc0', '#cbd5cf'], roofs = ['#6d4a43', '#7a5a4c', '#5d5a60', '#8a5446'];
    while (x < cx + hw * 1.95) {
      var w = (9 + rand() * 8) * s, h = (12 + rand() * 12) * s;
      house(g, x, by, w, h, pal[Math.floor(rand() * pal.length)], roofs[Math.floor(rand() * roofs.length)], s);
      x += w + 0.5 * s;
    }
    // cathedral dome with twin towers
    var dx = cx + hw * 1.05;
    ell(g, dx + 17 * s, by - 34 * s, 14 * s, 15 * s, '#5f9d8a');
    ell(g, dx + 14 * s, by - 38 * s, 5 * s, 8 * s, 'rgba(255,255,255,0.18)');
    rect(g, dx + 15.5 * s, by - 52 * s, 3 * s, 6 * s, '#5f9d8a');
    rect(g, dx, by - 30 * s, 34 * s, 30 * s, '#f1e7d2');
    rect(g, dx + 24 * s, by - 30 * s, 10 * s, 30 * s, '#cdbfa5');
    rect(g, dx - 2 * s, by - 46 * s, 9 * s, 46 * s, '#eadfc8'); rect(g, dx + 27 * s, by - 46 * s, 9 * s, 46 * s, '#cdbfa5');
    ell(g, dx + 2.5 * s, by - 48 * s, 4.5 * s, 5 * s, '#5f9d8a'); ell(g, dx + 31.5 * s, by - 48 * s, 4.5 * s, 5 * s, '#4f8878');
    // tall church spire
    var sx = cx + hw * 1.62;
    rect(g, sx, by - 26 * s, 9 * s, 26 * s, '#e6dcc6'); rect(g, sx + 5 * s, by - 26 * s, 4 * s, 26 * s, '#c9bba0');
    poly(g, [sx - 0.5 * s, by - 26 * s, sx + 4.5 * s, by - 84 * s, sx + 9.5 * s, by - 26 * s], '#546863');
    poly(g, [sx + 4.5 * s, by - 84 * s, sx + 9.5 * s, by - 26 * s, sx + 6 * s, by - 26 * s], 'rgba(0,0,0,0.22)');
    return { x: cx, y: ft - 28 * s, r: 58 * s };
  }

  function drawVienna(g, cx, by, s) {
    var rand = rng(41), x;
    var wall = '#bdb6bf', wall2 = '#c8c1c8', shade = '#9a96a8', roofc = '#7d8aa4', cop = '#78a595';
    for (x = cx - 104 * s; x < cx + 104 * s; x += 7 * s) {
      var h = (6 + rand() * 9) * s;
      rect(g, x, by - h, 7 * s + 0.5, h, rand() < 0.5 ? wall : wall2);
      rect(g, x, by - h, 7 * s + 0.5, 1.4 * s, roofc);
    }
    // Karlskirche
    var kx = cx - 74 * s;
    rect(g, kx - 20 * s, by - 14 * s, 40 * s, 14 * s, wall2);
    rect(g, kx - 9 * s, by - 34 * s, 18 * s, 20 * s, wall);
    ell(g, kx, by - 34 * s, 11 * s, 14 * s, cop);
    ell(g, kx - 3 * s, by - 38 * s, 4 * s, 7 * s, 'rgba(255,255,255,0.2)');
    rect(g, kx - 1 * s, by - 52 * s, 2 * s, 6 * s, cop);
    poly(g, [kx - 12 * s, by - 14 * s, kx, by - 24 * s, kx + 12 * s, by - 14 * s], wall);
    [-22, 22].forEach(function (o) {
      rect(g, kx + o * s - 2 * s, by - 38 * s, 4 * s, 26 * s, wall2);
      rect(g, kx + o * s - 2 * s, by - 38 * s, 2 * s, 26 * s, shade);
      ell(g, kx + o * s, by - 40 * s, 3.4 * s, 2.4 * s, cop);
    });
    // Stephansdom, nave and roof
    var nx0 = cx - 38 * s, nx1 = cx + 16 * s;
    rect(g, nx0, by - 24 * s, nx1 - nx0, 24 * s, wall);
    rect(g, cx + 2 * s, by - 24 * s, 14 * s, 24 * s, shade);
    g.save();

  function drawGloriette(g, cx, by, s) {
    var rand = rng(52), hillH = 40 * s, hw = 100 * s, ht = by - hillH, i;
    function hy(x) { var t = (x - cx) / hw; return (t > -1 && t < 1) ? by - hillH * Math.pow(1 - t * t, 0.7) : by; }
    var gr = g.createLinearGradient(0, ht, 0, by);
    gr.addColorStop(0, '#86ad5e'); gr.addColorStop(1, '#4f7e41');
    g.beginPath(); g.moveTo(cx - hw, by);
    for (i = -hw; i <= hw; i += 3 * s) g.lineTo(cx + i, hy(cx + i));
    g.lineTo(cx + hw, by); g.closePath(); g.fillStyle = gr; g.fill();
    for (i = 0; i < 30; i++) {
      var tx = cx - hw * 0.9 + rand() * hw * 1.8, ty = hy(tx) + 4 * s + rand() * (by - hy(tx)) * 0.8;
      circ(g, tx, ty, (1.6 + rand() * 2) * s, rand() < 0.5 ? '#3e6a3a' : '#527f45');
    }
    var cream = '#efe4cb', shade = '#cdbfa2', dark = '#55696f';
    var top = ht + 2 * s;
    rect(g, cx - 56 * s, top - 16 * s, 112 * s, 16 * s, cream);
    for (i = 0; i < 10; i++) {
      var ax = cx - 54 * s + i * 11 * s;
      if (Math.abs(ax + 3 * s - cx) < 24 * s) continue;
      rect(g, ax, top - 12 * s, 6 * s, 12 * s, dark);
      ell(g, ax + 3 * s, top - 12 * s, 3 * s, 2 * s, dark);
    }
    rect(g, cx - 56 * s, top - 18 * s, 112 * s, 2 * s, shade);
    rect(g, cx - 26 * s, top - 34 * s, 52 * s, 34 * s, cream);
    rect(g, cx + 14 * s, top - 34 * s, 12 * s, 34 * s, shade);
    for (i = -1; i <= 1; i++) {
      var qx = cx + i * 15 * s - 5 * s;
      rect(g, qx, top - 26 * s, 10 * s, 26 * s, dark);
      ell(g, qx + 5 * s, top - 26 * s, 5 * s, 4 * s, dark);
      rect(g, qx + 1.5 * s, top - 18 * s, 7 * s, 18 * s, 'rgba(150,176,180,0.55)');
    }
    rect(g, cx - 28 * s, top - 38 * s, 56 * s, 5 * s, '#dccda9');
    for (i = 0; i < 14; i++) rect(g, cx - 27 * s + i * 4 * s, top - 42 * s, 1.8 * s, 4 * s, cream);

    var ey = top - 48 * s;
    poly(g, [cx - 8 * s, ey - 1 * s, cx - 3 * s, ey - 4 * s, cx, ey - 2 * s, cx + 3 * s, ey - 4 * s, cx + 8 * s, ey - 1 * s, cx + 4 * s, ey + 2 * s, cx, ey + 4 * s, cx - 4 * s, ey + 2 * s], '#c8962b');
    return { x: cx, y: top - 22 * s, r: 40 * s };

  function drawHallstatt(g, cx, sy, s) {
    var rand = rng(63), r, i;

    g.fillStyle = 'rgba(60,50,45,0.7)'; g.fillRect(ex - 1 * s, sy - 38 * s, 2 * s, 5 * s); g.fillRect(ex - 1 * s, sy - 50 * s, 2 * s, 3 * s);
    // catholic parish church up the slope
    var cxx = cx + 50 * s, cy = sy - 5 * rowH;

    poly(g, [cxx - 14 * s, cy - 14 * s, cxx, cy - 24 * s, cxx + 14 * s, cy - 14 * s], '#5d646a');
    rect(g, cxx + 6 * s, cy - 36 * s, 8 * s, 24 * s, '#f6f1e6'); rect(g, cxx + 11 * s, cy - 36 * s, 3 * s, 24 * s, '#d9d1c0');
    poly(g, [cxx + 4.5 * s, cy - 36 * s, cxx + 10 * s, cy - 56 * s, cxx + 15.5 * s, cy - 36 * s], '#4f565c');
    line(g, cxx + 10 * s, cy - 56 * s, cxx + 10 * s, cy - 62 * s, '#3b4248', Math.max(0.8, s));

  /* ============ land: mountains, landmarks, lake ============ */
  function buildLand() {
    var L = mk(), g = L.g, rand = rng(5), por = H > W * 1.15;

    var A = mountainLayer(g, {
      baseY: H * (por ? 0.70 : 0.66), amp: H * (por ? 0.17 : 0.30), scale: sc, seed: 3,
      rock: '#7f97bb', haze: '#c9d6e6', snow: true,
      peaks: [{ x: gx, h: H * (por ? 0.09 : 0.14), w: W * 0.10, p: 1.5 }, { x: gx + W * 0.045, h: H * (por ? 0.05 : 0.07), w: W * 0.03, p: 1.3 }]
    });
    // summit cross on the Grossglockner
    var gyy = ptsY(A, gx);
    line(g, gx, gyy + 1, gx, gyy - 10 * S, '#3a2d25', Math.max(1, 1.2 * S));
    line(g, gx - 3.2 * S, gyy - 7 * S, gx + 3.2 * S, gyy - 7 * S, '#3a2d25', Math.max(1, 1.2 * S));
    addHit({ x: gx, y: gyy - 6 * S, r: 22 * S, text: 'Großglockner, 3.798 m' });

    var B = mountainLayer(g, {
      baseY: H * (por ? 0.755 : 0.735), amp: H * (por ? 0.15 : 0.22), scale: sc * 0.8, seed: 11,
      rock: '#5f7da3', haze: '#b3c6dc', snow: true
    });
    scene.ridgeB = B; scene.ridgeA = A;

    var vx = W * 0.44, hx = W * 0.745, vs = S * 0.78;
    var vi = drawVienna(g, vx, H * 0.77, vs);
    addHit({ x: vi.dom.x, y: vi.dom.y, r: Math.max(16, vi.dom.r), text: 'Stephansdom, Wien' });
    addHit({ x: vi.wheel.x, y: vi.wheel.y, r: Math.max(16, vi.wheel.r * 0.9), text: 'Riesenrad im Prater' });

    var C = mountainLayer(g, {
      baseY: H * 0.815, amp: H * 0.07, scale: Math.max(90, W * 0.12), seed: 47,
      rock: '#3a6644', haze: '#26492f', shade: 0.7,
      peaks: [{ x: hx + W * 0.02, h: H * 0.12, w: W * 0.14, p: 1.1 }, { x: vx, h: -H * 0.05, w: W * 0.11, p: 1.2 }]
    });
    spruces(g, C, rand, '#214e30', Math.max(10, H * 0.026));
    spruces(g, C, rng(8), 'rgba(110,170,90,0.35)', Math.max(7, H * 0.016));
    [0.018, 0.036, 0.054].forEach(function (off, k) {
      var P2 = C.map(function (p) { return [p[0], p[1] + H * off]; });
      spruces(g, P2, rng(20 + k), k % 2 ? '#2b5f3a' : '#244f31', Math.max(10, H * 0.026));
    });

    var sz = drawSalzburg(g, W * 0.155, H * 0.80, S);
    sz.text = 'Festung Hohensalzburg'; addHit(sz);

    var gl = drawGloriette(g, W * 0.915, H * 0.835, S * 0.9);
    gl.text = 'Gloriette, Schönbrunn'; addHit(gl);

    var hs = drawHallstatt(g, hx, shoreY, S);
    hs.text = 'Hallstatt am Hallstätter See'; addHit(hs);

    // warm light from the sun on everything that exists so far
    g.globalCompositeOperation = 'source-atop';
    var warm = g.createRadialGradient(W * 0.17, H * 0.16, 0, W * 0.17, H * 0.16, W * 0.9);
    warm.addColorStop(0, 'rgba(255,214,150,0.30)');
    warm.addColorStop(0.5, 'rgba(255,214,150,0.10)');
    warm.addColorStop(1, 'rgba(255,214,150,0)');
    g.fillStyle = warm; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over';
    layers.land = L.c;
  }

  function buildLake() {
    var L = mk(), g = L.g, rand = rng(71), i;
    g.save();
    g.beginPath();
    g.moveTo(lakeX0, shoreY + 2);
    g.bezierCurveTo(lakeX0 + W * 0.06, shoreY - H * 0.006, lakeX1 - W * 0.08, shoreY - H * 0.004, lakeX1, shoreY + 3);
    for (i = 0; i <= 24; i++) { var yy = shoreY + (H - shoreY) * i / 24; g.lineTo(lakeEdge(1, yy), yy); }
    for (i = 24; i >= 0; i--) { var y2 = shoreY + (H - shoreY) * i / 24; g.lineTo(lakeEdge(-1, y2), y2); }
    g.closePath();
    g.clip();
    var gr = g.createLinearGradient(0, shoreY, 0, H * 0.95);
    gr.addColorStop(0, '#bcd3d8'); gr.addColorStop(0.25, '#6aa5b2'); gr.addColorStop(0.7, '#2f7487'); gr.addColorStop(1, '#1f5d70');
    g.fillStyle = gr; g.fillRect(0, shoreY - 8, W, H);
    g.save();
    g.globalAlpha = 0.6; g.translate(0, 2 * shoreY); g.scale(1, -1);
    g.drawImage(layers.land, 0, 0, W, H);
    g.restore();
    var fr = g.createLinearGradient(0, shoreY, 0, shoreY + H * 0.14);
    fr.addColorStop(0, 'rgba(70,130,148,0)'); fr.addColorStop(1, 'rgba(36,100,120,0.85)');
    g.fillStyle = fr; g.fillRect(0, shoreY, W, H * 0.14);
    for (i = 0; i < 520; i++) {
      var t = Math.pow(rand(), 1.4), y = shoreY + t * (H - shoreY) * 0.95;
      var x = lakeX0 + rand() * (lakeX1 - lakeX0), len = (6 + rand() * 38) * S * (0.5 + t * 1.6);
      g.fillStyle = rand() < 0.6 ? 'rgba(255,255,255,' + (0.05 + rand() * 0.12).toFixed(2) + ')' : 'rgba(10,50,70,' + (0.06 + rand() * 0.1).toFixed(2) + ')';
      g.fillRect(x, y, len, 0.8 + t * 1.2);
    }
    g.restore();
    layers.lake = L.c;
    scene.sparkles = [];
    for (i = 0; i < 70; i++) {
      var tt = Math.pow(rand(), 0.8);
      scene.sparkles.push({ x: lakeX0 + W * 0.04 + rand() * (lakeX1 - lakeX0 - W * 0.08), y: shoreY + 4 + tt * H * 0.1, w: (3 + rand() * 7) * S, ph: rand() * 6.3, sp: 0.8 + rand() * 1.4 });
    }
  }

  /* ============ foreground props ============ */
  function drawSpruce(g, x, by, h) {
    var n = 12, w = h * 0.2, j, k;
    rect(g, x - h * 0.018, by - h * 0.08, h * 0.036, h * 0.1, '#3a2a1c');
    for (j = 0; j < n; j++) {
      var yb = by - h * 0.05 - j * (h * 0.9 / n), tw = w * (1 - j / n * 0.88) + h * 0.012, th = h * 0.9 / n * 2.2;
      var pts = [x, yb - th];
      var teeth = 7;
      for (k = 0; k <= teeth; k++) {
        pts.push(x - tw + (2 * tw) * k / teeth, yb + ((k % 2) ? -th * 0.05 : th * 0.06));
      }
      poly(g, pts, j % 2 ? '#1b4a2b' : '#20512f');
      poly(g, [x, yb - th, x - tw, yb + th * 0.04, x - tw * 0.1, yb], 'rgba(150,210,120,0.20)');
    }
  }
  function drawLarch(g, x, by, h, rand) {
    var tw = h * 0.035;
    poly(g, [x - tw, by, x - tw * 0.55, by - h * 0.72, x + tw * 0.55, by - h * 0.72, x + tw, by], '#5a4332');
    rect(g, x - tw, by - h * 0.4, tw * 0.9, h * 0.4, 'rgba(255,220,170,0.18)');
    var cols = ['#7e9a38', '#9db443', '#d2a838', '#b4a238', '#6f8c33'];
    var cy = by - h * 0.78, i;
    for (i = 0; i < 26; i++) {
      var a = rand() * TAU, d = Math.pow(rand(), 0.7) * h * 0.2;
      circ(g, x + Math.cos(a) * d * 1.1, cy + Math.sin(a) * d * 0.9, h * (0.05 + rand() * 0.06), cols[Math.floor(rand() * cols.length)]);
    }
    for (i = 0; i < 12; i++) circ(g, x + (rand() - 0.5) * h * 0.3, cy + h * 0.1 + rand() * h * 0.08, h * 0.04, 'rgba(40,60,20,0.25)');
  }
  function heart(g, x, y, r, c) {
    g.fillStyle = c; g.beginPath();
    g.moveTo(x, y + r * 0.9);

  }

        var w1 = Math.sin(TAU * (1.35 * u + 0.14 * v) - p1);
        var w2 = Math.sin(TAU * (2.4 * u - 0.18 * v) - p2) * 0.3;
        var w3 = Math.sin(TAU * (4.2 * u + 0.3 * v) - p3) * 0.08 * u;
        G[i * R1 + r] = A * env * (w1 + w2 + w3) + droop * u * u;
      }
    }
    var mid = ROWS >> 1, x = flagX;
    XV[0] = x;
    for (i = 0; i < COLS; i++) {
      var s = (G[(i + 1) * R1 + mid] - G[i * R1 + mid]) / SW;
      x += SW / Math.sqrt(1 + s * s);
      XV[i + 1] = x;
    }
    var rh = fh / ROWS, srcW = flagImg.width / COLS, srcH = flagImg.height / ROWS;
    for (i = 0; i < COLS; i++) {
      var dx = XV[i + 1] - XV[i] + 0.9;
      for (r = 0; r < ROWS; r++) {
        var yT = flagY + r * rh + G[i * R1 + r];
        var yB = flagY + (r + 1) * rh + G[i * R1 + r + 1];
        var hh = yB - yT + 0.9;
        ctx.drawImage(flagImg, i * srcW, r * srcH, srcW, srcH, XV[i], yT, dx, hh);
        var sx = ((G[(i + 1) * R1 + r] - G[i * R1 + r]) + (G[(i + 1) * R1 + r + 1] - G[i * R1 + r + 1])) / (2 * SW);
        ctx.fillStyle = shadeStyles[Math.round(clamp(sx * 0.7, -1, 1) * 12) + 12];
        ctx.fillRect(XV[i], yT, dx, hh);
      }
    }
  }
  function drawPole() {
    var x = poleX, w = pw;
    var gr = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    gr.addColorStop(0, '#6d7276'); gr.addColorStop(0.3, '#f4f6f8'); gr.addColorStop(0.55, '#b5bbc0'); gr.addColorStop(1, '#4b5055');
    ctx.fillStyle = gr; ctx.fillRect(x - w / 2, poleTop + rb * 0.8, w, H);
    ctx.strokeStyle = '#c9ced3'; ctx.lineWidth = Math.max(2, w * 0.28);
    [flagY + fh * 0.08, flagY + fh * 0.92].forEach(function (ry) {
      ctx.beginPath(); ctx.ellipse(x, ry, w * 0.85, w * 0.45, 0, 0, TAU); ctx.stroke();
    });
    ctx.fillStyle = '#c99a1c'; ctx.fillRect(x - w * 0.75, poleTop + rb * 0.55, w * 1.5, rb * 0.5);
    var bg = ctx.createRadialGradient(x - rb * 0.35, poleTop - rb * 0.35, rb * 0.1, x, poleTop, rb);
    bg.addColorStop(0, '#fff3b0'); bg.addColorStop(0.35, '#e6b422'); bg.addColorStop(1, '#7a5a0a');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, poleTop, rb, 0, TAU); ctx.fill();
  }

  /* ============ speech bubbles, counter, confetti, sound ============ */
  var bubble = null, confetti = [], counterT0 = 0;
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
  }
  function drawBubble(now) {
    if (!bubble) return;
    var age = (now - bubble.t0) / 1000;
    if (age > 3.2) { bubble = null; return; }
    var a = age < 0.15 ? age / 0.15 : (age > 2.7 ? (3.2 - age) / 0.5 : 1);
    var fs = Math.round(clamp(15 * Math.max(S, 0.85), 14, 20));
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = '400 ' + fs + 'px Gloock, Georgia, serif';
    var tw = ctx.measureText(bubble.text).width, bw = tw + 26, bh = fs + 18;
    var bx = clamp(bubble.x - bw / 2, 8, W - bw - 8), by = Math.max(8, bubble.y - bh - 16 + (1 - a) * 6);
    ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#fffdf6'; rr(ctx, bx, by, bw, bh, 10); ctx.fill();
    ctx.shadowColor = 'transparent';
    var tx = clamp(bubble.x, bx + 14, bx + bw - 14);
    ctx.beginPath(); ctx.moveTo(tx - 7, by + bh - 0.5); ctx.lineTo(tx, by + bh + 8); ctx.lineTo(tx + 7, by + bh - 0.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(190,170,130,0.55)'; ctx.lineWidth = 1; rr(ctx, bx, by, bw, bh, 10); ctx.stroke();
    ctx.fillStyle = '#2a1c1e'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(bubble.text, bx + bw / 2, by + bh / 2 + 1);
    ctx.restore();
  }
  function drawCounter(now) {
    if (!foundCount) return;
    var a = clamp((now - counterT0) / 500, 0, 1);
    var txt = 'Entdeckt: ' + foundCount + ' von ' + EGGS.length;
    ctx.save(); ctx.globalAlpha = a * 0.92;
    ctx.font = '600 12px system-ui, -apple-system, "Segoe UI", sans-serif';
    var w = ctx.measureText(txt).width + 22, h = 24, x = 14, y = H - h - 14 - (window.visualViewport ? 0 : 0);
    ctx.fillStyle = 'rgba(20,28,24,0.62)'; rr(ctx, x, y, w, h, 12); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, x + 11, y + h / 2 + 0.5);
    ctx.restore();
  }
  function spawnConfetti() {
    for (var i = 0; i < 160; i++) {
      confetti.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 60, vy: 90 + Math.random() * 140, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 9, c: Math.random() < 0.5 ? '#ed2939' : '#ffffff', w: 6 + Math.random() * 6, h: 3 + Math.random() * 4 });
    }
  }
  function drawConfetti(dt) {
    if (!confetti.length) return;
    for (var i = confetti.length - 1; i >= 0; i--) {
      var c = confetti[i];
      c.x += c.vx * dt + Math.sin(c.rot) * 20 * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
      if (c.y > H + 20) { confetti.splice(i, 1); continue; }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      if (c.c === '#ffffff') { ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 0.6; ctx.strokeRect(-c.w / 2, -c.h / 2, c.w, c.h); }
      ctx.restore();
    }
  }
  var actx = null;
  function audio() {
    try {
      if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
    return actx;
  }
  function tone(a, f0, f1, t0, dur, vol, type) {
    var o = a.createOscillator(), gn = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.8);
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function playBell() {
    var a = audio(); if (!a) return; var t = a.currentTime;
    [0, 0.24].forEach(function (d) { tone(a, 640, 640, t + d, 1.1, 0.12); tone(a, 1010, 1010, t + d, 0.8, 0.06); tone(a, 1610, 1610, t + d, 0.5, 0.03); });
  }
  function playWhistle() {
    var a = audio(); if (!a) return; var t = a.currentTime;
    tone(a, 1900, 2900, t, 0.45, 0.07); tone(a, 2900, 2500, t + 0.5, 0.2, 0.05);
  }

  /* ============ render + loop ============ */
  function render(t, wind, now, dt) {
    ctx.drawImage(layers.sky, 0, 0, W, H);
    drawClouds(t);
    ctx.drawImage(layers.land, 0, 0, W, H);
    drawMists(t);
    drawWheel(t);
    drawCable(t);
    var i;
    if (scene.smoke) for (i = 0; i < scene.smoke.length; i++) drawSmoke(scene.smoke[i].x, scene.smoke[i].y, t, S * 0.8, i * 0.37);
    drawBirds(t);
    drawEagle(t);
    drawBalloon(t);
    ctx.drawImage(layers.lake, 0, 0, W, H);
    drawLakeLife(t);
    drawFlag(t, wind);
    drawPole();
    ctx.drawImage(layers.fore, 0, 0, W, H);
    if (scene.hutSmoke) drawSmoke(scene.hutSmoke.x, scene.hutSmoke.y, t, S, 0.2);
    drawButterflies(t);
    drawMarmot(t);
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
    drawConfetti(dt || 0);
    drawCounter(now);
    drawBubble(now);
  }

  var last = 0, raf = 0, running = false, tAnim = 0;
  function frame(ts) {
    var t = ts / 1000, dt = Math.min(0.05, Math.max(0, t - last)); last = t;
    var wind = 1 + 0.06 * Math.sin(t * 0.21) + 0.04 * Math.sin(t * 0.47 + 1);
    if (!reduce) {
      var sp = 0.5 + 0.5 * wind;
      p1 += dt * TAU * 0.42 * sp; p2 += dt * TAU * 0.7 * sp; p3 += dt * TAU * 1.05 * sp;
      tAnim = t;
    } else wind = 1;
    render(tAnim, wind, Date.now(), dt);
    if (!reduce || bubble || confetti.length) raf = requestAnimationFrame(frame); else running = false;
  }
  function kick() { if (!running) { running = true; last = performance.now() / 1000; raf = requestAnimationFrame(frame); } }

  /* ============ interaction: only the hidden things react ============ */
  function onTap(e) {
    var x = e.clientX, y = e.clientY, best = null, bs = 1e9;
    hits.forEach(function (h) {
      if (h.ok && !h.ok()) return;
      var p = h.get ? h.get() : h, rad = Math.max(h.r, 14), d = Math.hypot(x - p.x, y - p.y);
      if (d > rad) return;
      var score = d / rad - (h.egg ? 1 : 0);
      if (score < bs) { bs = score; best = h; }
    });
    if (!best) return;
    var p = best.get ? best.get() : best;
    bubble = { text: best.text, x: p.x, y: p.y - Math.max(best.r * 0.6, 8), t0: Date.now() };
    if (best.snd === 'bell') playBell(); else if (best.snd === 'whistle') playWhistle();
    if (best.onHit) best.onHit();
    if (best.egg && !found[best.id]) {
      found[best.id] = true; foundCount++; counterT0 = Date.now();
      if (foundCount === EGGS.length) {
        setTimeout(function () { bubble = { text: 'Alles entdeckt. Servus!', x: W / 2, y: H * 0.5, t0: Date.now() }; spawnConfetti(); kick(); }, 1400);
      }
    }
    kick();
  }
  canvas.addEventListener('pointerdown', onTap);

  var rt = 0, fontOk = false;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { build(fontOk); if (reduce) render(0, 1, Date.now(), 0); }, 150);
  });

  function start() {
    build(fontOk);
    if (reduce) { render(0, 1, Date.now(), 0); }
    else { running = true; last = performance.now() / 1000; raf = requestAnimationFrame(frame); }
  }
  var timeout = new Promise(function (res) { setTimeout(res, 1500); });
  var fontLoad = (document.fonts && document.fonts.load)
    ? document.fonts.load('400 40px Gloock').then(function (f) { fontOk = !!(f && f.length); }, function () {})
    : Promise.resolve();
  Promise.race([fontLoad, timeout]).then(start);

})();

</script>
</body>
