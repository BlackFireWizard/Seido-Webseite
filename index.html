<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robin Seido</title>
<meta name="description" content="Diese Seite gehört Robin Seido.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='34' fill='%23ed2939'/%3E%3Crect y='34' width='100' height='32' fill='%23fff'/%3E%3Crect y='66' width='100' height='34' fill='%23ed2939'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    grid-template-rows: 1fr 1fr 1fr;
    background: #ed2939;
    color: #1d1416;
    font-family: "Gloock", Georgia, "Times New Roman", serif;
  }
  .rot { background: #ed2939; }
  .weiss {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
  }
  h1 {
    font-weight: 400;
    font-size: clamp(2.2rem, 7.5vw, 6.5rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    max-width: 14ch;
    text-wrap: balance;
    animation: rein 0.9s ease-out both;
  }
  @keyframes rein {
    from { opacity: 0; transform: scale(1.12); }
    to   { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none; }
  }
</style>
</head>
<body>
  <div class="rot"></div>
  <main class="weiss">
    <h1>Diese Seite gehört Robin Seido.</h1>
  </main>
  <div class="rot"></div>
</body>
</html>
